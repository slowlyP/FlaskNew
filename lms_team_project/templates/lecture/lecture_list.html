{% extends "layout.html" %}

{% block css %}
<link rel="stylesheet"
      href="{{ url_for('static',
      filename='css/lecture.css') }}">
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2 class="lecture-title mb-4">📚 강의 목록</h2>

    <div class="row g-4">

        {% for lec in lectures %}

        <div class="col-md-4">

            <div class="lecture-card">

                <!-- 카드 헤더 -->
                <div class="lecture-header">
                    📘 {{ lec.title }}
                </div>
            
                <!-- 카드 바디 -->
                <div class="lecture-body">
            
                    <p>👨‍🏫 강사 : {{ lec.teacher_name }}</p>
            
                    <p>
                        👥 정원 :
                        <span class="badge bg-primary">
                            {{ lec.capacity }}
                        </span>
                    </p>
            
                    <a href="/lecture/{{ lec.id }}"
                       class="btn btn-outline-primary btn-sm w-100">
                       상세보기 →
                    </a>
            
                </div>

            </div>

        </div>

        {% endfor %}

    </div>   <!-- row 끝 -->

</div>       <!-- container 끝 -->


<!-- ⭐ 관리자만 보이는 플로팅 + 버튼 -->
{% if session.get('role') == 'admin' %}

<a href="/admin/lecture/add" class="floating-add-btn">
    <i class="bi bi-plus-lg"></i>
</a>

{% endif %}

{% endblock %}
