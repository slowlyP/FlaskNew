{% extends "layout.html" %}

{% block css %}
<link rel="stylesheet"
      href="{{ url_for('static',
      filename='css/board.css') }}">
{% endblock %}

{% block content %}

<div class="board-wrapper">

    <!-- 상단 제목 -->
    <div class="board-top">
        <h2>📋 게시판</h2>
    </div>


    <!-- ================= 테이블 ================= -->
    <table class="board-table">

        <tr>
            <th>No</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
            <th>조회수</th>
        </tr>

        {% for b in boards %}
        <tr>

            <td>{{ b.id }}</td>

            <td class="title">
                <a href="/boards/detail/{{ b.id }}">
                    {{ b.title }}
                </a>
            </td>

            <td>{{ b.member_id }}</td>
            <td>{{ b.created_at }}</td>
            <td>{{ b.views }}</td>

        </tr>
        {% endfor %}

    </table>


    <!-- ================= 페이징 ================= -->
    <div class="pagination">

        {% for p in range(1, total_pages+1) %}
            <a href="/boards/?page={{ p }}"
               class="{% if p==page %}active{% endif %}">
               {{ p }}
            </a>
        {% endfor %}

    </div>


    <!-- ================= 하단 검색 + 글쓰기 ================= -->
    <div class="board-bottom">

        <!-- 중앙 검색 -->
        <form method="get" class="search-box">

            <input type="text"
                   name="keyword"
                   placeholder="Search">

        </form>

        <!-- 우측 글쓰기 -->
        <div class="write-box">

            <a href="/boards/write"
               class="write-btn">
               글쓰기
            </a>

        </div>

    </div>

</div>  <!-- wrapper 끝 -->

{% endblock %}
